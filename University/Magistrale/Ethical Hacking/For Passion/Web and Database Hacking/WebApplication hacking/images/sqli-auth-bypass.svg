<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="6" y="6" width="748" height="418" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="380" y="42" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">SQL Injection &#8212; bypass del login</text>

  <!-- Panel A: normal -->
  <rect x="26" y="66" width="708" height="150" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="44" y="94" font-size="14" font-weight="700" fill="#15803d">Input normale</text>
  <text x="44" y="122" font-family="monospace" font-size="13" fill="#475569">utente: <tspan fill="#1e293b" font-weight="700">alice</tspan>&#160;&#160;·&#160;&#160;password: <tspan fill="#1e293b" font-weight="700">s3cret</tspan></text>
  <text x="44" y="160" font-family="monospace" font-size="13" fill="#1e293b">SELECT * FROM users WHERE user='<tspan fill="#2563eb" font-weight="700">alice</tspan>' AND pass='<tspan fill="#2563eb" font-weight="700">s3cret</tspan>'</text>
  <text x="44" y="198" font-size="12.5" fill="#15803d">&#10003; controlla utente E password &#8594; accesso solo se entrambi corretti</text>

  <!-- Panel B: injected -->
  <rect x="26" y="232" width="708" height="176" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="44" y="260" font-size="14" font-weight="700" fill="#b91c1c">Input iniettato</text>
  <text x="44" y="288" font-family="monospace" font-size="13" fill="#475569">utente: <tspan fill="#dc2626" font-weight="700">admin'--</tspan>&#160;&#160;·&#160;&#160;password: <tspan fill="#64748b">(qualsiasi)</tspan></text>
  <text x="44" y="326" font-family="monospace" font-size="13" fill="#1e293b">SELECT * FROM users WHERE user='<tspan fill="#dc2626" font-weight="700">admin'--</tspan><tspan fill="#94a3b8">' AND pass='...'</tspan></text>
  <text x="44" y="352" font-family="monospace" font-size="11.5" font-style="italic" fill="#94a3b8">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160; tutto dopo -- &#232; un commento SQL, quindi ignorato</text>
  <text x="44" y="388" font-size="12.5" fill="#b91c1c">&#10007; la password non viene mai verificata &#8594; accesso come admin</text>
</svg>

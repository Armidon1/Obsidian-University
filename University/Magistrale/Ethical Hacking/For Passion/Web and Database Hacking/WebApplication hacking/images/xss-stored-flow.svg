<svg viewBox="0 0 760 450" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="6" y="6" width="748" height="438" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="380" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#1e293b">XSS Stored &#8212; il percorso dell'attacco</text>

  <defs>
    <marker id="aR" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="aB" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="aO" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#ea580c"/>
    </marker>
    <marker id="aD" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- boxes -->
  <rect x="40" y="78" width="150" height="92" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="115" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">Attaccante</text>
  <text x="115" y="140" text-anchor="middle" font-size="11" fill="#64748b">inietta lo script</text>

  <rect x="305" y="70" width="150" height="108" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="380" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#c2410c">App + DB</text>
  <text x="380" y="132" text-anchor="middle" font-size="11" fill="#64748b">il sito vulnerabile</text>

  <rect x="570" y="78" width="150" height="92" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="645" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">Vittima</text>
  <text x="645" y="140" text-anchor="middle" font-size="11" fill="#64748b">un altro utente</text>

  <!-- arrows -->
  <!-- 1 attacker -> app -->
  <line x1="190" y1="104" x2="303" y2="104" stroke="#dc2626" stroke-width="2.5" marker-end="url(#aR)"/>
  <circle cx="246" cy="104" r="11" fill="#dc2626"/><text x="246" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <!-- 2 inside app -->
  <circle cx="380" cy="160" r="11" fill="#ea580c"/><text x="380" y="164" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
  <!-- 3 victim -> app -->
  <line x1="568" y1="104" x2="457" y2="104" stroke="#2563eb" stroke-width="2.5" marker-end="url(#aB)"/>
  <circle cx="513" cy="104" r="11" fill="#2563eb"/><text x="513" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
  <!-- 4 app -> victim -->
  <line x1="457" y1="144" x2="568" y2="144" stroke="#ea580c" stroke-width="2.5" marker-end="url(#aO)"/>
  <circle cx="513" cy="144" r="11" fill="#ea580c"/><text x="513" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">4</text>
  <!-- 5 victim -> attacker (bottom) -->
  <polyline points="645,170 645,206 115,206 115,172" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#aD)"/>
  <circle cx="380" cy="206" r="11" fill="#475569"/><text x="380" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">5</text>

  <!-- legend -->
  <rect x="40" y="236" width="680" height="190" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="62" y="266" font-size="13" fill="#1e293b"><tspan font-weight="700" fill="#dc2626">1.</tspan> L'attaccante invia un commento che contiene <tspan font-family="monospace" fill="#b91c1c">&#60;script&#62;...&#60;/script&#62;</tspan></text>
  <text x="62" y="298" font-size="13" fill="#1e293b"><tspan font-weight="700" fill="#ea580c">2.</tspan> L'app lo <tspan font-weight="700">salva nel database</tspan> senza codificarlo / sanitizzarlo</text>
  <text x="62" y="330" font-size="13" fill="#1e293b"><tspan font-weight="700" fill="#2563eb">3.</tspan> La vittima apre la pagina che contiene quel commento</text>
  <text x="62" y="362" font-size="13" fill="#1e293b"><tspan font-weight="700" fill="#ea580c">4.</tspan> L'app le serve la pagina <tspan font-weight="700">con lo script incorporato</tspan></text>
  <text x="62" y="394" font-size="13" fill="#1e293b"><tspan font-weight="700" fill="#475569">5.</tspan> Lo script gira nel browser della vittima e <tspan font-weight="700">invia il suo cookie di sessione</tspan> all'attaccante</text>
</svg>
